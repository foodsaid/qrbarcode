name: Release

# Pushing a tag such as v0.1.4 publishes a GitHub Release whose notes are that
# version's CHANGELOG.md section.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0  # needed to check the tag is on main

    - name: Check tag matches version and is on main
      env:
        TAG: ${{ github.ref_name }}
      run: |
        version="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' main.py)"
        if [ "v${version}" != "${TAG}" ]; then
          echo "::error::Tag ${TAG} does not match main.__version__ (${version})"
          exit 1
        fi
        if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
          echo "::error::Tag ${TAG} points at a commit that is not on main"
          exit 1
        fi

    - name: Extract release notes from CHANGELOG
      env:
        TAG: ${{ github.ref_name }}
      run: python3 scripts/release_notes.py "${TAG}" > release-notes.md

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file release-notes.md
