name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Weekly re-scan so newly published advisories surface without a push
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR/branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to commit SHAs (all run on Node.js 24)
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
      fail-fast: false  # Don't cancel other jobs if one fails

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        # requirements-dev.txt includes the production lock; every package is hash-checked
        pip install --require-hashes -r requirements-dev.txt

    - name: Audit locked dependencies
      run: |
        pip-audit --strict --require-hashes --disable-pip -r requirements.txt
        pip-audit --strict --require-hashes --disable-pip -r requirements-mcp.txt
        pip-audit --strict --require-hashes --disable-pip -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 main.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 main.py --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Format check with black
      run: |
        black --check main.py tests/

    - name: Type check with mypy
      run: |
        mypy main.py --ignore-missing-imports

    - name: Security scan with bandit
      run: |
        bandit -r main.py

    - name: Check CHANGELOG covers the current version
      run: |
        # The version in main.py must have a CHANGELOG section before it can be released
        python scripts/release_notes.py "$(python -c 'import main; print(main.__version__)')" > /dev/null

    - name: Run tests with pytest
      run: |
        pytest --cov=main --cov=codes --cov=gs1 --cov=signing --cov=qr_mcp --cov-report=term

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: .
        push: false
        load: true
        tags: qr-service:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run -d -p 8080:8080 -e PORT=8080 --name qr-test qr-service:test
        # Wait for the image's own HEALTHCHECK instead of a fixed sleep
        for _ in $(seq 1 30); do
          [ "$(docker inspect -f '{{.State.Health.Status}}' qr-test)" = healthy ] && break
          sleep 2
        done
        [ "$(docker inspect -f '{{.State.Health.Status}}' qr-test)" = healthy ]
        curl -fsS http://localhost:8080/health
        curl -fsS -o /dev/null http://localhost:8080/docs
        curl -fsS -o /dev/null http://localhost:8080/apispec.json
        curl -fsS -o qr.png "http://localhost:8080/generate?content=CI"
        curl -fsS -o bc.png "http://localhost:8080/generate?content=CI-123&type=barcode"
        curl -fsS -o dm.png "http://localhost:8080/generate?content=CI&type=datamatrix"
        curl -fsS -o ean.png "http://localhost:8080/generate?content=590123412345&type=ean13"
        file qr.png bc.png dm.png ean.png | grep -c "PNG image" | grep -qx 4
        curl -fsS "http://localhost:8080/generate?content=CI&type=datamatrix&format=svg" | grep -q "<svg"
        curl -fsS "http://localhost:8080/gs1/digital-link?gtin=9506000134352&batch=CI&expiry=271231" \
          | grep -q '"uri":"https://id.gs1.org/01/09506000134352/10/CI?17=271231"'
        curl -fsS -o gs1.png "http://localhost:8080/generate?type=gs1datamatrix&gtin=9506000134352&batch=CI"
        file gs1.png | grep -q "PNG image"
        docker logs qr-test
        docker stop qr-test

    - name: Check runtime licenses
      run: docker run --rm -i --entrypoint python qr-service:test - < scripts/check_licenses.py

    # Scans the built image, including OS packages from the base image
    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        scan-type: 'image'
        image-ref: 'qr-service:test'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

  lint-dockerfile:
    name: Dockerfile Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Lint Dockerfile with hadolint
      run: |
        docker run --rm -i \
          hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
          hadolint --ignore DL3008 --ignore DL3013 - < Dockerfile  # v2.15.1

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # Swagger UI and the DOMPurify copy in its bundle are invisible to pip-audit/Dependabot
    - name: Check vendored front-end code against OSV
      run: python3 scripts/check_vendored.py

    # Results go to the job log
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'
