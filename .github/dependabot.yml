# Dependabot version updates. Security updates are enabled in repository settings
# and are not delayed by the cooldown below.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    # Supply-chain cooldown: only propose releases at least 14 days old
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Minor/patch bumps arrive as one PR; each major bump gets its own PR
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(docker)"
